<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#00629B" />
    <title>İnternet bağlantısı yok · IEEE İKÇÜ</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f6f9; color: #17324d; font: 17px/1.6 system-ui, sans-serif; }
      main { max-width: 30rem; padding: 2rem; }
      h1 { font-size: 1.8rem; line-height: 1.2; }
      button { border: 0; border-radius: .5rem; padding: .8rem 1.3rem; background: #00629b; color: white; font: inherit; cursor: pointer; }
      button:focus-visible { outline: 3px solid #17324d; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p>IEEE İKÇÜ</p>
      <h1>İnternet bağlantısı yok</h1>
      <p>Güncel verileri görmek ve işlem yapmak için internete bağlanın. Bağlantınız geri geldiğinde açmak istediğiniz sayfayı yeniden deneyebilirsiniz.</p>
      <button type="button" onclick="window.location.reload()">Yeniden dene</button>
    </main>
  </body>
</html>
