name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Firebase emülatörleri Java gerektirir
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Güvenlik kuralı testleri
        run: npm run test:rules
      - name: Uçtan uca testler (istemci + kurallar)
        run: npm run test:e2e
