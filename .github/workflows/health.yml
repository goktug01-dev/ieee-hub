name: Canlı Sağlık Kontrolü

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Canlı sayfaları doğrula
        shell: bash
        run: |
          set -euo pipefail
          base='https://ieee-hub-techops.web.app'
          for path in / /giris /dilekceler /yonetim/sablonlar; do
            body="$(curl --fail --silent --show-error --location --retry 3 "$base$path")"
            grep -q '<title>IEEE İKÇÜ Hub</title>' <<< "$body"
            grep -q 'id="root"' <<< "$body"
          done
